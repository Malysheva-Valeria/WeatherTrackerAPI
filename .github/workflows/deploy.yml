name: Deploy

# Деплой запускається лише після успішного CI на головній гілці.
# Конкретні кроки залежать від цільового середовища (Docker registry,
# сервер, хмара) — нижче кістяк зі збіркою Docker-образу як приклад.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: weathertracker-api:${{ github.sha }}

