[mypy]
python_version = 3.11
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
warn_redundant_casts = True
no_implicit_optional = True

# --- Легасі / ORM-важкі модулі ----------------------------------------------
# mypy без SQLAlchemy-плагіна дає багато хибних спрацювань на Column[...],
# а weather_service історично оперує нетипізованими dict'ами. Ці модулі
# поки виключені з суворої перевірки — борг на поступову типізацію
# (міграція моделей на Mapped[] / типізація weather_service).
[mypy-app.api.models.*]
ignore_errors = True

[mypy-app.api.routers.*]
ignore_errors = True

[mypy-app.api.services.weather_service]
ignore_errors = True

[mypy-app.api.services.analytics_service]
ignore_errors = True

[mypy-app.api.services.auth_service]
ignore_errors = True

[mypy-app.main]
ignore_errors = True
